<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
    header { background: #6c63ff; color: white; padding: 20px; text-align: center; }
    header h1 { font-size: 24px; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
    .card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h3 { font-size: 13px; color: #888; margin-bottom: 5px; }
    .card p { font-size: 22px; font-weight: bold; }
    .income p { color: #4caf50; }
    .expense p { color: #f44336; }
    .savings p { color: #2196f3; }
    .fun p { color: #ff9800; }
    .balance-bar { background: #6c63ff; color: white; text-align: center; padding: 15px; margin: 0 15px; border-radius: 12px; font-size: 20px; font-weight: bold; }
    .form-section { background: white; margin: 15px; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-section h2 { margin-bottom: 15px; font-size: 18px; }
    select, input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button.add-btn { width: 100%; padding: 12px; background: #6c63ff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .transactions { margin: 15px; }
    .transactions h2 { margin-bottom: 10px; }
    .transaction-item { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.07); }
    .transaction-item .info .type { font-size: 12px; color: white; padding: 3px 8px; border-radius: 20px; display: inline-block; margin-bottom: 4px; }
    .income-tag { background: #4caf50; }
    .expense-tag { background: #f44336; }
    .savings-tag { background: #2196f3; }
    .fun-tag { background: #ff9800; }
    .transaction-item .info .desc { font-size: 14px; color: #555; }
    .transaction-item .right .amount { font-size: 18px; font-weight: bold; }
    .transaction-item .right .date { font-size: 11px; color: #aaa; text-align: right; }
    .delete-btn { background: none; border: none; color: #f44336; font-size: 20px; cursor: pointer; margin-left: 10px; }
  </style>
</head>
<body>

<header>
  <h1>💰 Finance Tracker</h1>
</header>

<div class="summary">
  <div class="card income"><h3>💵 Income</h3><p id="income">0</p></div>
  <div class="card expense"><h3>🛒 Expenses</h3><p id="expense">0</p></div>
  <div class="card savings"><h3>🐷 Savings</h3><p id="savings">0</p></div>
  <div class="card fun"><h3>🎉 Fun</h3><p id="fun">0</p></div>
</div>

<div class="balance-bar">Balance: <span id="balance">0</span> L</div>

<div class="form-section">
  <h2>Add Transaction</h2>
  <select id="type">
    <option value="income">💵 Income</option>
    <option value="expense">🛒 Expense</option>
    <option value="savings">🐷 Savings</option>
    <option value="fun">🎉 Fun</option>
  </select>
  <input type="text" id="category" placeholder="Category (e.g. Salary, Food...)" />
  <input type="number" id="amount" placeholder="Amount (L)" />
  <input type="text" id="description" placeholder="Description" />
  <button class="add-btn" onclick="addTransaction()">+ Add</button>
</div>

<div class="transactions">
  <h2>Transactions</h2>
  <div id="transaction-list"></div>
</div>

<script>
  const API = '/api/transactions';

  async function loadSummary() {
    const res = await fetch(API + '/summary');
    const data = await res.json();
    document.getElementById('income').textContent = data.income.toFixed(2);
    document.getElementById('expense').textContent = data.expense.toFixed(2);
    document.getElementById('savings').textContent = data.savings.toFixed(2);
    document.getElementById('fun').textContent = data.fun.toFixed(2);
    document.getElementById('balance').textContent = data.balance.toFixed(2);
  }

  async function loadTransactions() {
    const res = await fetch(API);
    const data = await res.json();
    const list = document.getElementById('transaction-list');
    list.innerHTML = '';
    data.reverse().forEach(t => {
      const date = new Date(t.date).toLocaleDateString();
      list.innerHTML += `
        <div class="transaction-item">
          <div class="info">
            <span class="type ${t.type}-tag">${t.type}</span>
            <div class="desc">${t.category} — ${t.description}</div>
          </div>
          <div class="right">
            <div class="amount">${parseFloat(t.amount).toFixed(2)} L</div>
            <div class="date">${date}</div>
          </div>
          <button class="delete-btn" onclick="deleteTransaction('${t.id}')">🗑</button>
        </div>`;
    });
  }

  async function addTransaction() {
    const type = document.getElementById('type').value;
    const category = document.getElementById('category').value;
    const amount = document.getElementById('amount').value;
    const description = document.getElementById('description').value;
    if (!category || !amount) return alert('Please fill all fields!');
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, category, amount, description })
    });
    document.getElementById('category').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('description').value = '';
    loadSummary();
    loadTransactions();
  }

  async function deleteTransaction(id) {
    await fetch(API + '/' + id, { method: 'DELETE' });
    loadSummary();
    loadTransactions();
  }

  loadSummary();
  loadTransactions();
</script>

</body>
</html>
